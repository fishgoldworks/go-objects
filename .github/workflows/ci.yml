name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run docs
      - run: git diff --exit-code -- README.md docs/API.md
      - run: npm run verify
      - name: Check generated output
        run: |
          git diff --exit-code -- src
          test -z "$(git ls-files --others --exclude-standard -- src)"
          test ! -e dist && test ! -e esm && test ! -e index.mjs
          test -z "$(find src -type d \( -name temp -o -name .tmp \) -prune -o -name '*.d.ts' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: consumer-package
          path: artifacts/*.tgz
  runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['8.0.0', '8.17.0', '10.0.0', '12.17.0', '13.0.0', '13.7.0', '14.0.0', '16.0.0', '22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: echo "CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: consumer-package
          path: artifacts
      - name: Test the same installed package on the selected runtime
        shell: bash
        run: |
          args=()
          case '${{ matrix.node }}' in 8.*|10.*|13.0.0) ;; *) args+=(--esm);; esac
          npm run test:runtime -- --node "$CONSUMER_NODE" --tarball "$(find artifacts -name '*.tgz' -print -quit)" "${args[@]}"
  browser:
    needs: verify
    # Keep the runner aligned with pinned Playwright 1.57 browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/browser/requirements.txt
      - run: npm ci
      - run: python -m pip install -r test/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: consumer-package
          path: artifacts
      - name: Verify browser behavior from the same candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/go-objects-browser"
          printf '%s\n' '{"private":true}' > "$RUNNER_TEMP/go-objects-browser/package.json"
          npm install --prefix "$RUNNER_TEMP/go-objects-browser" --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$(find "$PWD/artifacts" -name '*.tgz' -print -quit)"
          for browser in chromium firefox webkit; do
            for bundle in go-objects.js go-objects.min.js; do
              npm run test:browser -- --package "$RUNNER_TEMP/go-objects-browser/node_modules/go-objects" --browser "$browser" --bundle "$bundle"
            done
          done

  typescript-compatibility:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        typescript: ['5.3.3', '5.8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: consumer-package
          path: artifacts
      - name: Install isolated compiler and the verified candidate
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/type-compiler" --ignore-scripts --no-audit --no-fund --package-lock=false typescript@${{ matrix.typescript }}
          npm install --prefix "$RUNNER_TEMP/type-consumer" --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$PWD"/artifacts/*.tgz
      - name: Check shared inference and rejection fixtures
        run: npm run test:types -- --compiler "${{ runner.temp }}/type-compiler/node_modules/typescript/lib/tsc.js" --package "${{ runner.temp }}/type-consumer/node_modules/go-objects"
