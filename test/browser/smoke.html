  <body>
    <h1>go-objects browser checks</h1>
    <p>
      Serve the project directory over HTTP, then open this file. The static module graph and both distributed browser
      formats are checked.
    </p>
    <pre id="results">Running…</pre>
    <script src="../../package/dist/go-objects.js"></script>
    <script type="module">
      const results = [];
      function assert(condition, message = 'Unexpected result') {
        if (!condition) throw new Error(message);
      }
      function equal(actual, expected) {
        assert(
          JSON.stringify(actual) === JSON.stringify(expected),
          JSON.stringify(actual) + ' != ' + JSON.stringify(expected)
        );
      }
      function check(name, fn) {
        try {
          fn();
          results.push({ name, pass: true });
        } catch (error) {
          results.push({ name, pass: false, error: String(error.stack || error) });
        }
      }
      function suite(O, label) {
        const source = () => ({ a: 1, b: 2, c: 1 });
        const deep = () => ({ a: { x: 1 }, b: [2, 1] });
        const checks = {
          setImmutable: () => {
            const a = { n: 1, b: { x: 2 } },
              b = O.setImmutable(a, 'n', 2);
            assert(a.n === 1 && b.n === 2 && b.b === a.b);
          },
          updateImmutable: () => {
            const a = Object.freeze({ n: 1 }),
              b = O.updateImmutable(a, 'n', (n) => n + 1);
            assert(a.n === 1 && b.n === 2);
          },
          unsetImmutable: () => {
            const a = { n: 1 },
              b = O.unsetImmutable(a, 'n');
            assert(a.n === 1 && !Object.hasOwn(b, 'n'));
          },
          deepFindEntry: () => equal(O.deepFindEntry({ a: { n: 1 } }, 1), [['a', 'n'], 1]),
          has: () => assert(O.has({ a: { x: undefined } }, 'a.x') && !O.has({ a: 1 }, 'missing')),
          update: () => {
            const obj = { attempts: 2 };
            assert(O.update(obj, 'attempts', (n) => n + 1) === 2 && obj.attempts === 3);
          },
          some: () => assert(O.some({ a: 0, b: 1 }, 0) && !O.some({}, undefined)),
          every: () => assert(O.every({}, undefined) && !O.every({ a: 1, b: 2 }, 1)),
          findEntry: () => equal(O.findEntry({ a: 1, b: 2 }, 2), ['b', 2]),
          keys: () => equal(O.keys(source()), ['a', 'b', 'c']),
          values: () => equal(O.values(source()), [1, 2, 1]),
          entries: () => equal(O.entries({ a: 1 }), [['a', 1]]),
          hasKey: () => assert(O.hasKey({ a: 1 }, 'a')),
          hasProp: () => assert(O.hasProp(Object.defineProperty({}, 'x', { value: 1 }), 'x')),
          hasValue: () => assert(O.hasValue({ a: NaN }, NaN)),
          get: () => assert(O.get({ a: null }, 'a.b', 9) === 9),
          getEach: () => equal(O.getEach(source(), ['a', 'b']), [1, 2]),
          set: () => {
            const obj = {};
            O.set(obj, 'a[0].x', 3);
            equal(obj, { a: [{ x: 3 }] });
          },
          setEach: () => {
            const obj = { a: 1, b: 2 };
            equal(O.setEach(obj, ['a', 'b'], 9), [1, 2]);
            equal(obj, { a: 9, b: 9 });
          },
          unset: () => {
            const obj = { a: 1 };
            assert(O.unset(obj, 'a'));
            equal(obj, {});
          },
          forEach: () => {
            let total = 0;
            O.forEach(source(), (v) => (total += v));
            assert(total === 4);
          },
          map: () =>
            equal(
              O.map({ a: 1 }, (v) => v * 2),
              { a: 2 }
            ),
          mapKeys: () =>
            equal(
              O.mapKeys({ a: 1 }, (v, k) => k.toUpperCase()),
              { A: 1 }
            ),
          filter: () =>
            equal(
              O.filter(source(), (v) => v > 1),
              { b: 2 }
            ),
          reduce: () => assert(O.reduce(source(), (a, v) => a + v, 0) === 4),
          reduceRight: () => assert(O.reduceRight({ a: 'a', b: 'b' }, (a, v) => a + v, '') === 'ba'),
          find: () => assert(O.find(source(), 2) === 2),
          findLast: () => assert(O.findLast(source(), (v) => v > 0) === 1),
          findAll: () => equal(O.findAll(source(), 1), [1, 1]),
          findKey: () => assert(O.findKey(source(), 2) === 'b'),
          findPath: () => equal(O.findPath(deep(), 2), ['b', '0']),
          count: () => assert(O.count(source(), 1) === 2),
          pick: () => equal(O.pick(source(), ['b']), { b: 2 }),
          omit: () => equal(O.omit(source(), ['a', 'c']), { b: 2 }),
          merge: () => equal(O.merge({ a: 1 }, { a: 2, b: 3 }), { a: 2, b: 3 }),
          intersect: () => equal(O.intersect(source(), { b: 2 }), { b: 2 }),
          except: () => equal(O.except(source(), { a: 1, c: 1 }), { b: 2 }),
          remove: () => {
            const obj = source();
            assert(O.remove(obj, 1) === 1);
            equal(obj, { b: 2, c: 1 });
          },
          removeLast: () => {
            const obj = source();
            assert(O.removeLast(obj, 1) === 1);
            equal(obj, { a: 1, b: 2 });
          },
          removeAll: () => {
            const obj = source();
            equal(O.removeAll(obj, 1), [1, 1]);
            equal(obj, { b: 2 });
          },
          replace: () => {
            const obj = source();
            assert(O.replace(obj, 1, 9) === 1);
            assert(obj.a === 9);
          },
          replaceLast: () => {
            const obj = source();
            assert(O.replaceLast(obj, 1, 9) === 1);
            assert(obj.c === 9);
          },
          replaceAll: () => {
            const obj = source();
            equal(O.replaceAll(obj, 1, 9), [1, 1]);
            equal(obj, { a: 9, b: 2, c: 9 });
          },
          clone: () => {
            const input = deep(),
              copy = O.clone(input);
            assert(copy !== input && copy.a === input.a);
          },
          deepClone: () => {
            const input = deep(),
              copy = O.deepClone(input);
            assert(copy !== input && copy.a !== input.a);
            equal(copy, input);
          },
          deepForEach: () => {
            let count = 0;
            O.deepForEach(deep(), () => count++);
            assert(count === 5);
          },
          deepMap: () =>
            equal(
              O.deepMap(deep(), (v) => (typeof v === 'number' ? v * 2 : v)),
              { a: { x: 2 }, b: [4, 2] }
            ),
          deepMapKeys: () =>
            equal(
              O.deepMapKeys({ a: { x: 1 } }, (v, k) => k.toUpperCase()),
              { A: { X: 1 } }
            ),
          deepFilter: () =>
            equal(
              O.deepFilter(deep(), (v) => typeof v !== 'number' || v > 1),
              { a: {}, b: [2] }
            ),
          deepFind: () => assert(O.deepFind(deep(), 2) === 2),
          deepFindLast: () => assert(O.deepFindLast(deep(), 1) === 1),
          deepFindAll: () => equal(O.deepFindAll(deep(), 1), [1, 1]),
          deepFindKey: () => assert(O.deepFindKey(deep(), 2) === '0'),
          deepCount: () => assert(O.deepCount(deep(), 1) === 2),
          deepRemove: () => {
            const obj = deep();
            assert(O.deepRemove(obj, 1) === 1);
            equal(obj.a, {});
          },
          deepRemoveLast: () => {
            const obj = deep();
            assert(O.deepRemoveLast(obj, 1) === 1);
            assert(!(1 in obj.b));
          },
          deepRemoveAll: () => {
            const obj = deep();
            equal(O.deepRemoveAll(obj, 1), [1, 1]);
            assert(O.deepCount(obj, 1) === 0);
          },
          deepReplace: () => {
            const obj = deep();
            assert(O.deepReplace(obj, 1, 9) === 1);
            assert(obj.a.x === 9);
          },
          deepReplaceLast: () => {
            const obj = deep();
            assert(O.deepReplaceLast(obj, 1, 9) === 1);
            assert(obj.b[1] === 9);
          },
          deepReplaceAll: () => {
            const obj = deep();
            equal(O.deepReplaceAll(obj, 1, 9), [1, 1]);
            assert(O.deepCount(obj, 9) === 2);
          }
        };
        for (const realm of ['local', 'foreign']) {
          function hostValue(run) {
            const iframe = realm === 'foreign' ? document.createElement('iframe') : undefined;
            if (iframe) document.body.appendChild(iframe);
            const value = iframe ? iframe.contentDocument.all : document.all;
            const key = Symbol('host property');
            Object.defineProperty(value, key, { value: 42, enumerable: true, configurable: true });
            try {
              run(value, key);
            } finally {
              delete value[key];
              if (iframe) iframe.remove();
            }
          }
          check(label + ': ' + realm + ' document.all own-property queries', () => {
            equal(O.keys(undefined), []);
            assert(!O.hasProp(undefined, 'missing'));
            hostValue((value, key) => {
              assert(Object(value) === value && value !== undefined, 'Host collection is an object');
              const keys = Object.keys(value).concat(
                Object.getOwnPropertySymbols(value).filter((name) =>
                  Object.prototype.propertyIsEnumerable.call(value, name)
                )
              );
              assert(O.keys(value).every((name, index) => name === keys[index]));
              assert(O.keys(value).length === keys.length);
              assert(O.values(value).every((item, index) => item === value[keys[index]]));
              assert(O.values(value).length === keys.length);
              const entries = O.entries(value);
              assert(entries.length === keys.length);
              assert(entries.every(([name, item], index) => name === keys[index] && item === value[name]));
              assert(O.hasKey(value, key) && O.hasProp(value, key) && O.hasValue(value, 42));
              assert(O.get(value, key) === 42 && O.has(value, [key]));
            });
          });
          check(label + ': ' + realm + ' document.all root traversal', () => {
            hostValue((value, key) => {
              assert(O.deepFind(value, 42) === 42);
              const mapped = O.map(value, (item) => item);
              assert(mapped[key] === 42);
            });
          });
          check(label + ': ' + realm + ' document.all clone policy', () => {
            hostValue((value) => {
              for (const name of ['clone', 'deepClone']) {
                assert(O[name](undefined, { unsupported: 'throw' }) === undefined);
                assert(O[name](value) === value);
                let threw = false;
                try {
                  O[name](value, { unsupported: 'throw' });
                } catch (error) {
                  assert(error instanceof TypeError);
                  threw = true;
                }
                assert(threw, 'Unsupported host object must be rejected');
              }
              assert(O.deepClone({ host: value }).host === value);
              let threw = false;
              try {
                O.deepClone({ host: value }, { unsupported: 'throw' });
              } catch (error) {
                assert(error instanceof TypeError);
                threw = true;
              }
              assert(threw);
            });
          });
        }
        for (const realm of ['local', 'foreign']) {
          function callableHost(run) {
            const iframe = realm === 'foreign' ? document.createElement('iframe') : undefined;
            if (iframe) document.body.appendChild(iframe);
            const doc = iframe ? iframe.contentDocument : document;
            const element = doc.createElement('div');
            element.id = 'go_objects_callable_host_target';
            doc.body.appendChild(element);
            try {
              run(doc.all, element, element.id);
            } finally {
              element.remove();
              if (iframe) iframe.remove();
            }
          }
          check(label + ': ' + realm + ' callable host transformations', () => {
            callableHost((callback, element, id) => {
              const source = { 0: id };
              assert(Reflect.apply(callback, source, [id, '0', source]) === element, 'Native callable control');
              assert(O.map(source, callback)[0] === element);
              assert(O.filter(source, callback)[0] === id);
              assert(O.forEach(source, callback) === source);
              assert(O.deepForEach(source, callback) === source);
              assert(O.deepMap(source, callback)[0] === element);
              assert(O.deepFilter(source, callback)[0] === id);
              assert(O.reduce({ 0: 0 }, callback, id) === element);
              assert(O.reduceRight({ 0: 0 }, callback, id) === element);
              equal(O.map({}, callback), {});
              for (const invalid of [undefined, null, {}, 0]) {
                let threw = false;
                try {
                  O.map({}, invalid);
                } catch (error) {
                  assert(error instanceof TypeError);
                  threw = true;
                }
                assert(threw, 'Non-callable control must fail even for an empty input');
              }
            });
          });
          check(label + ': ' + realm + ' callable host predicates', () => {
            callableHost((predicate, element, id) => {
              const source = { 0: id };
              assert(O.count(source, predicate) === 1 && O.some(source, predicate) && O.every(source, predicate));
              assert(O.find(source, predicate) === id && O.findLast(source, predicate) === id);
              equal(O.findAll(source, predicate), [id]);
              assert(O.findKey(source, predicate) === '0');
              equal(O.findEntry(source, predicate), ['0', id]);
              assert(O.deepCount(source, predicate) === 1);
              assert(O.deepFind(source, predicate) === id && O.deepFindLast(source, predicate) === id);
              equal(O.deepFindAll(source, predicate), [id]);
              assert(O.deepFindKey(source, predicate) === '0');
              equal(O.findPath(source, predicate), ['0']);
              equal(O.deepFindEntry(source, predicate), [['0'], id]);
              assert(O.find({ 0: 'missing_host_target' }, predicate) === undefined);
              assert(Reflect.apply(predicate, source, [id, '0', source]) === element);
            });
          });
          check(label + ': ' + realm + ' callable host replacements', () => {
            callableHost((replacement, element, id) => {
              for (const method of [
                'replace',
                'replaceLast',
                'replaceAll',
                'deepReplace',
                'deepReplaceLast',
                'deepReplaceAll'
              ]) {
                const source = { 0: id };
                O[method](source, id, replacement);
                assert(source[0] === element, method);
              }
              const source = { 0: id };
              assert(O.update(source, '0', replacement) === id && source[0] === element);
              assert(O.updateImmutable({ 0: id }, '0', replacement)[0] === element);
              for (const method of [
                'remove',
                'removeLast',
                'removeAll',
                'deepRemove',
                'deepRemoveLast',
                'deepRemoveAll'
              ]) {
                const input = { 0: id };
                O[method](input, replacement);
                assert(!Object.prototype.hasOwnProperty.call(input, '0'), method);
              }
            });
          });
          check(label + ': ' + realm + ' falsy callable host descent', () => {
            callableHost((shouldDescend, element, id) => {
              const child = { 0: id },
                source = { branch: child },
                options = { shouldDescend };
              assert(Reflect.apply(shouldDescend, source, [child, 'branch', source, ['branch']]) === null);
              let calls = 0;
              O.deepForEach(
                source,
                () => {
                  calls++;
                },
                options
              );
              assert(calls === 1, 'Falsy callback must still decide descent');
              assert(O.deepFind(source, id, options) === undefined);
              assert(O.deepMap(source, (value) => value, options).branch === child);
              assert(O.deepFilter(source, () => true, options).branch === child);
              assert(O.deepMapKeys(source, (_, key) => key, options).branch === child);
              equal(O.deepReplaceAll(source, id, element, options), []);
              assert(child[0] === id);
            });
          });
        }
        for (const method of ['clone', 'deepClone']) {
          check(label + ': ' + method + ' rejects inherited Error tags without invocation', () => {
            const frame = document.createElement('iframe');
            document.body.appendChild(frame);
            const realm = frame.contentWindow;
            try {
              for (const owner of [realm.Error.prototype, realm.Object.prototype]) {
                let reads = 0;
                Object.defineProperty(owner, Symbol.toStringTag, {
                  configurable: true,
                  get() {
                    reads++;
                    throw new Error('Inherited tag getter must not run');
                  }
                });
                try {
                  const source = new realm.TypeError('tagged');
                  assert(O[method](source) === source);
                  let threw = false;
                  try {
                    O[method](source, { unsupported: 'throw' });
                  } catch (error) {
                    assert(error instanceof TypeError);
                    threw = true;
                  }
                  assert(threw && reads === 0);
                  const record = new realm.Object();
                  record.value = 42;
                  assert(O[method](record).value === 42 && reads === 0);
                } finally {
                  delete owner[Symbol.toStringTag];
                }
              }
            } finally {
              frame.remove();
            }
          });
        }
        for (const method of ['clone', 'deepClone']) {
          for (const policy of ['reference', 'throw']) {
            check(label + ': ' + method + ' revalidates changed Error constructors (' + policy + ')', () => {
              let reads = 0,
                calls = 0;
              const proto = new Proxy(Error.prototype, {
                getOwnPropertyDescriptor(target, key) {
                  const descriptor = Reflect.getOwnPropertyDescriptor(target, key);
                  if (key === 'constructor' && ++reads >= 3)
                    return {
                      ...descriptor,
                      value: function Unexpected() {
                        calls++;
                        return new Error('wrong');
                      }
                    };
                  return descriptor;
                }
              });
              const input = new Proxy(new Error('source'), { getPrototypeOf: () => proto });
              if (policy === 'reference') assert(O[method](input) === input);
              else {
                let threw = false;
                try {
                  O[method](input, { unsupported: policy });
                } catch (error) {
                  assert(error instanceof TypeError);
                  threw = true;
                }
                assert(threw);
              }
              assert(calls === 0);
            });
          }
        }
        for (const method of ['clone', 'deepClone']) {
          check(label + ': ' + method + ' rejects Error prototype lookalikes', () => {
            const fake = Object.create(Error.prototype);
            assert(O[method](fake) === fake);
            let threw = false;
            try {
              O[method](fake, { unsupported: 'throw' });
            } catch (error) {
              assert(error instanceof TypeError);
              threw = true;
            }
            assert(threw);
          });
          check(label + ': ' + method + ' rejects stable Error proxies', () => {
            const proxy = new Proxy(new TypeError('source'), {});
            assert(O[method](proxy) === proxy);
            let threw = false;
            try {
              O[method](proxy, { unsupported: 'throw' });
            } catch (error) {
              assert(error instanceof TypeError);
              threw = true;
            }
            assert(threw);
          });
        }
        for (const method of ['setImmutable', 'updateImmutable', 'unsetImmutable']) {
          check(label + ': ' + method + ' rejects arbitrary array-object prototypes', () => {
            const proto = [],
              input = [1];
            Object.setPrototypeOf(input, proto);
            let called = false,
              threw = false;
            try {
              if (method === 'setImmutable') O[method](input, [0], 2);
              else if (method === 'updateImmutable')
                O[method](input, [0], (value) => {
                  called = true;
                  return value + 1;
                });
              else O[method](input, [0]);
            } catch (error) {
              assert(error instanceof TypeError);
              threw = true;
            }
            assert(threw && input[0] === 1 && Object.getPrototypeOf(input) === proto);
            if (method === 'updateImmutable') assert(!called);
          });
        }
        for (const name of Object.keys(O))
          check(label + ': ' + name, () => {
            assert(typeof checks[name] === 'function', 'Missing browser check for ' + name);
            checks[name]();
          });
        check(label + ': has terminal getter safety', () => {
          const obj = {
            get a() {
              throw new Error('terminal');
            }
          };
          assert(O.has(obj, 'a'));
        });
        check(label + ': updater failure leaves no new branches', () => {
          const obj = {};
          let threw = false;
          try {
            O.update(obj, 'a[0].b', () => {
              throw new Error('callback');
            });
          } catch {
            threw = true;
          }
          assert(threw && Object.keys(obj).length === 0);
        });
        check(label + ': update rejects unsafe paths before callback', () => {
          let calls = 0,
            threw = false;
          try {
            O.update({}, 'constructor.prototype.polluted', () => ++calls);
          } catch {
            threw = true;
          }

        });
        check(label + ': short-circuit value reads', () => {
          const obj = {
            a: 0,
            get b() {
              throw new Error('must not read');
            }

          assert(O.some(obj, 0) && !O.every(obj, 1));
          equal(O.findEntry(obj, 0), ['a', 0]);
        });
        check(label + ': entry value snapshot', () => {
          let reads = 0;
          const obj = {
            get a() {
              return ++reads;
            }
          };
          equal(
            O.findEntry(obj, () => true),
            ['a', 1]

          assert(reads === 1);
        });
        check(label + ': count argument presence and getters', () => {
          assert(O.count({ a: undefined, b: 1 }) === 2);
          assert(O.count({ a: undefined, b: 1 }, undefined) === 1);
          assert(
            O.count({
              get a() {
                throw new Error('count getter');
              }
            }) === 1
          );
        });
        check(label + ': omission skips excluded getters', () => {
          const obj = {
            a: 1,
            get secret() {
              throw new Error('excluded');
            }
          };
          equal(O.omit(obj, ['secret']), { a: 1 });
        });
        check(label + ': strict shallow collisions', () => {
          let threw = false;
          try {
            O.mapKeys({ A: 1, a: 2 }, (v, k) => k.toLowerCase(), { onCollision: 'throw' });
          } catch {
            threw = true;
          }
          assert(threw);
        });
        check(label + ': strict deep collisions and depth limit', () => {
          const obj = { nested: { A: 1, a: 2 } };
          let threw = false;
          try {
            O.deepMapKeys(obj, (v, k) => k.toLowerCase(), { onCollision: 'throw' });
          } catch {
            threw = true;
          }

        check(label + ': new wrapper value/result', () => {
          const obj = { a: 1 },

        });
        check(label + ': persistent wrapper branches', () => {
          const a = O({ x: 1 }),
            b = a.keys(),
            c = b.count();
          assert(a.unwrap().x === 1);
          equal(b.unwrap(), ['x']);
          assert(c.unwrap() === 1);

        check(label + ': preserved array keys', () => {
          const a = O.deepMapKeys({ a: [{ x_y: 1 }] }, (_, k) => String(k).replace('_', ''), { arrays: 'preserve' });
          equal(a, { a: [{ xy: 1 }] });

        check(label + ': missing replacement is rejected', () => {
          const a = { x: 1 };
          let threw = false;
          try {
            O.replaceAll(a, () => true);
          } catch {
            threw = true;
          }
          assert(threw && a.x === 1);

        check(label + ': immutable hole deletion', () => {
          const a = Object.freeze([1, 2]),
            b = O.unsetImmutable(a, 0);

        check(label + ': immutable path-local cycle', () => {
          const a = { n: 1 };
          a.self = a;
          const b = O.setImmutable(a, 'n', 2);
          assert(b.self === a && a.n === 1 && b.n === 2);

        check(label + ': deep entry observed getter', () => {
          let reads = 0;

            O.deepFindEntry(
              {
                a: {
                  get n() {
                    return ++reads;
                  }
                }

            [['a', 'n'], 1]

          assert(reads === 1);
        });
        check(label + ': namespace completeness', () => assert(Object.keys(O).length === 60));
        check(label + ': cycles and Map/Set aliases', () => {
